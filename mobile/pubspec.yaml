# ---------------------------------------------------------------------------
# CraftHaat — Mobile app (Flutter)
#
# Setup:
#   flutter create . --project-name crafthaat   # if scaffolding fresh
#   flutter pub get
#
# Or add deps individually:
#   flutter pub add flutter_bloc hive hive_flutter connectivity_plus http \
#     path_provider record audioplayers image_picker equatable uuid \
#     flutter_image_compress
#   flutter pub add --dev hive_generator build_runner
# ---------------------------------------------------------------------------
name: crafthaat
description: Offline-first mobile app for marginalized artisans to catalog products via voice + photo.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Local persistence (offline-first cache / draft queue)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity-aware background sync
  connectivity_plus: ^6.0.5

  # Networking
  http: ^1.2.2

  # Filesystem
  path_provider: ^2.1.4

  # Audio: hold-to-record + playback of drafts
  record: ^5.1.2
  audioplayers: ^6.1.0

  # Camera / gallery capture
  image_picker: ^1.1.2

  # Client-side image compression (WebP, resize) before upload
  flutter_image_compress: ^2.3.0

  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
